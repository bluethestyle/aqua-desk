# Aqua Desk CI — typecheck + game-spec 테스트 + 웹 빌드, 그리고 hosted Supabase 대상 E2E.
# NEXT_PUBLIC_* 값은 클라 번들에 이미 노출되는 공개 값(publishable 키)이라 yml에 직접 둔다.
# secret(sb_secret_*) 키는 어떤 경우에도 CI에 두지 않는다(GUARDRAILS §7).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://cflqnkuhfyxhwwoksxzc.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_gZKxZqCX8ZrKC4Bces8fGw_cJT0PfAz

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: game-spec tests (parity vectors)
        run: npm test -w packages/game-spec
      - name: Build web
        run: npm run build -w apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (android/ios/desktop 프로파일 — hosted Supabase 대상)
        # 각 테스트가 새 익명 유저를 만든다 — auth rate_limit.anonymous_users=300/h 전제.
        run: npm run test:e2e -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
